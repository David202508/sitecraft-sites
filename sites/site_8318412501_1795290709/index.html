<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sito web — SiteCraft</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a; color: #f8fafc; line-height: 1.6;
        }
        header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
            padding: 16px 7%; background: #1e293b; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .logo { font-size: 1.25rem; font-weight: 800; color: #2563eb; }
        .vip-tag {
            background: #2563eb; color: #000; font-size: 0.7rem;
            padding: 2px 7px; border-radius: 6px; margin-left: 8px;
        }
        .hero { text-align: center; padding: 60px 20px 35px; max-width: 820px; margin: 0 auto; }
        .hero h1 { font-size: 2.5rem; color: #2563eb; margin-bottom: 12px; }
        .hero p { color: #cbd5e1; font-size: 1.1rem; margin-bottom: 24px; }
        .btn-main {
            background: #2563eb; color: #000; font-weight: 700; border: none;
            padding: 12px 24px; border-radius: 12px; cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35); text-decoration: none; display: inline-block;
        }
        .btn-sec {
            background: transparent; color: #f8fafc; border: 1px solid #2563eb;
            padding: 12px 20px; border-radius: 12px; cursor: pointer;
            text-decoration: none; display: inline-block;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .extra-box {
            background: #1e293b; border-left: 4px solid #2563eb;
            padding: 14px 18px; border-radius: 10px; margin-bottom: 22px;
        }
        .sec-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 18px; }
        .sec-btn {
            background: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.14);
            padding: 10px 16px; border-radius: 12px; cursor: pointer; font-weight: 600;
        }
        .sec-btn.active { background: #2563eb; color: #000; border-color: #2563eb; }
        .sec-panel {
            display: none; background: #1e293b; padding: 26px;
            border-radius: 14px; border: 1px solid #2563eb;
        }
        .sec-panel.active { display: block; }
        .sec-panel h3 { color: #2563eb; font-size: 1.35rem; margin-bottom: 10px; }
        .sec-panel p { color: #cbd5e1; margin-bottom: 18px; }
        footer {
            text-align: center; padding: 36px 20px; margin-top: 44px;
            border-top: 1px solid rgba(255,255,255,0.08); color: #cbd5e1;
        }
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
            justify-content: center; align-items: center; padding: 20px; z-index: 50;
        }
        .modal-box {
            background: #1e293b; padding: 26px; border-radius: 16px;
            max-width: 400px; width: 100%; text-align: center; border: 1px solid #2563eb;
        }
        .modal-box input {
            width: 100%; padding: 11px; margin: 12px 0; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: #f8fafc;
        }
        .status-msg { margin-top: 10px; font-size: 0.9rem; color: #2563eb; min-height: 20px; }
    </style>
</head>
<body>
    <header>
        <div class="logo">Sito web</div>
        <button type="button" class="btn-main" onclick="openModal('Invia richiesta')">Invia richiesta</button>
    </header>

    <section class="hero">
        <h1>Sito web</h1>
        <p>Tema</p>
        <button type="button" class="btn-main" onclick="openModal('Invia richiesta')">Invia richiesta</button>
    </section>

    <div class="container" id="sections">
        <div class="extra-box"><strong>Extra:</strong> 🧮 Калькулятор / Акция</div>
        <h2>Sezioni</h2>
        <div class="sec-tabs">
            <button type="button" class="sec-btn active" data-idx="0" onclick="openSection(0, true)">Bui rio tyu rino</button>
        </div>
        
        <div class="sec-panel active" id="sec-panel-0">
            <h3>Bui rio tyu rino</h3>
            <p>Sezione «Bui rio tyu rino» per «Tema».</p>
            <button type="button" class="btn-main" onclick="openModal('Bui rio tyu rino')">Richiedi per questa sezione</button>
        </div>
        
    </div>

    <footer>
        <p>Contatto: <strong>@Dzhalodavid</strong></p>
        <p style="margin-top: 10px;"><a href="https://t.me/Dzhalodavid?text=%D0%97%D0%B0%D1%8F%D0%B2%D0%BA%D0%B0%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%82%D1%83%20%C2%ABSito%20web%C2%BB" target="_blank" rel="noopener noreferrer" class="btn-sec">Scrivi su Telegram</a></p>
        <p style="font-size: 0.8rem; margin-top: 12px;">SiteCraft • ⚡ Создать сайт</p>
    </footer>

    <div class="modal" id="modal">
        <div class="modal-box">
            <h3 id="modal-title" style="color: #2563eb;">Invia richiesta</h3>
            <p style="font-size: 0.9rem; color: #cbd5e1; margin-top: 6px;">Inserisci il contatto e apri la chat per inviare</p>
            <input type="text" id="client-contact" placeholder="Il tuo @username o telefono">
            <a id="tg-send-link" href="https://t.me/Dzhalodavid?text=%D0%97%D0%B0%D1%8F%D0%B2%D0%BA%D0%B0%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%82%D1%83%20%C2%ABSito%20web%C2%BB" target="_blank" rel="noopener noreferrer" class="btn-main" style="width: 100%;" onclick="prepareSend(event)">Apri Telegram e invia</a>
            <div class="status-msg" id="status-msg"></div>
            <button type="button" class="btn-sec" style="width: 100%; margin-top: 10px;" onclick="closeModal()">Chiudi</button>
        </div>
    </div>

    <script>
        const baseTgUrl = "https://t.me/Dzhalodavid?text=%D0%97%D0%B0%D1%8F%D0%B2%D0%BA%D0%B0%20%D0%BF%D0%BE%20%D0%BF%D1%80%D0%BE%D0%B5%D0%BA%D1%82%D1%83%20%C2%ABSito%20web%C2%BB";
        let currentTopic = "Invia richiesta";

        function openSection(idx, shouldScroll) {
            document.querySelectorAll('.sec-panel').forEach((el, i) => el.classList.toggle('active', i === idx));
            document.querySelectorAll('.sec-btn').forEach((btn) => btn.classList.toggle('active', Number(btn.dataset.idx) === idx));
            if (shouldScroll) {
                const box = document.getElementById('sections');
                if (box) box.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function buildShareUrl(clientVal) {
            return baseTgUrl + encodeURIComponent(" | " + currentTopic + (clientVal ? " | " + clientVal : ""));
        }

        function openModal(topic) {
            currentTopic = topic;
            document.getElementById('modal-title').innerText = topic;
            document.getElementById('status-msg').innerText = "";
            document.getElementById('tg-send-link').href = buildShareUrl(document.getElementById('client-contact').value.trim());
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function prepareSend(e) {
            const val = document.getElementById('client-contact').value.trim();
            const statusEl = document.getElementById('status-msg');
            if (!val) {
                e.preventDefault();
                statusEl.innerText = "!";
                return;
            }
            document.getElementById('tg-send-link').href = buildShareUrl(val);
            statusEl.innerText = "OK";
        }
    </script>
</body>
</html>
